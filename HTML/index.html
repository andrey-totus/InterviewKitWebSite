<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewKit</title>
    <link rel="stylesheet" href="../CSS/main.css">
     <link rel="stylesheet" href="../CSS/registration.css">
    
</head>
<body class="body">
    <div class="header">
        <h1 class="logo">InterviewKit</h1>
        <p class="slogan">Твоя следующая работа – наша работа!</p>
    </div>
    <div class="MainDiv">
        <h2>Регистрация</h2>
        <div class="input-group">
            <label for="name">Имя</label>
            <input type="text" id="name" placeholder="Введите имя" required>
        </div>
        <div class="input-group">
            <label for="email">Почта</label>
            <input type="email" id="email" placeholder="Введите почту" required>
        </div>
        <button class="GreenButton" onclick="register()">Зарегистрироваться</button>
    </div>
    <script src="../JS/main.js"></script>
</body>
</html>
